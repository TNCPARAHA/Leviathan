[mcu]  # MAINBOARD  LEVIATHAN_V1.3
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_310034000251333236353439-if00
restart_method: command
##--------------------------------------------------------------------

[mcu nhk]  # NITEHAWK JABBERWOCKY TOOLHEAD 
serial: /dev/serial/by-id/usb-Klipper_rp2040_3033393834055A9D-if00   # DO NOT CHANGE 
baud: 1000000
restart_method: command

## CARTOGRAPHER MCU DEFINED IN cartographer_scanner.cfg
# [mcu Cartographer]  # CARTOGRAPHER SCANNER - ATTACHED TO TOOLHEAD
# serial: /dev/serial/by-id/usb-Cartographer_614e_230029000443565633393720-if00  # DO NOT CHANGE 


####################################################################

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 10000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[safe_z_home]
home_xy_position: 175, 175  # Center of 350mm bed
speed: 100
z_hop: 10
z_hop_speed: 15


 





####################################################################
#   X/Y Stepper Settings
#####################################################################
## X Stepper on HV_Stepper0 (Motor A - Left)
## X Endstop - Physical switch on Leviathan board (PC1 connector)
[stepper_x]
step_pin: PB10
dir_pin: PB11
enable_pin: !PG0
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: PC1
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

## Make sure to update below for your relevant driver (2209 or 5160)
[tmc5160 stepper_x]
cs_pin: PE15
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
interpolate: false
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

## Y Stepper on HV_Stepper1 (Motor B - Right)
## Y Endstop - Physical switch on Leviathan board (PC2 connector)
[stepper_y]
step_pin: PF15
dir_pin: !PF14
enable_pin: !PE9
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: PC2
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

## Make sure to update below for your relevant driver (2209 or 5160)
[tmc5160 stepper_y]
cs_pin: PE11
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
interpolate: false
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

#####################################################################
#   Z Stepper Settings
#####################################################################
## Z0 Stepper - Front Left (PHYSICALLY: front left)
##  Connected to STEPPER 0
[stepper_z]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD7
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 340
position_min: -5
homing_speed: 5
second_homing_speed: 1
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PD5
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

## Z1 Stepper - Rear Left (PHYSICALLY: back left)
##  Connected to STEPPER 3
[stepper_z1]
step_pin: PG7
dir_pin: !PG6
enable_pin: !PC7
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PG8
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

## Z2 Stepper - Rear Right (PHYSICALLY: back right)
##  Connected to STEPPER 1
[stepper_z2]
step_pin: PC12
dir_pin: PC11
enable_pin: !PD2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PD0
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

## Z3 Stepper - Front Right (PHYSICALLY: front right)
##  Connected to STEPPER 2
[stepper_z3]
step_pin: PC9
dir_pin: !PC8
enable_pin: !PC10
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PA8
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
