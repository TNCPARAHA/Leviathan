#####################################################################
#   Extruder Configuration
#####################################################################

[extruder]
step_pin: nhk:gpio23
dir_pin: !nhk:gpio24
enable_pin: !nhk:gpio25
microsteps: 16
rotation_distance: 35
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nhk:gpio9
sensor_type: Generic 3950
sensor_pin: nhk:gpio29
pullup_resistor: 2200
control: pid
pid_kp: 43.100
pid_ki: 11.972  
pid_kd: 38.790
min_temp: 0
max_temp: 315
min_extrude_temp: 170
max_extrude_only_distance: 1000
max_extrude_cross_section: 30
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
sense_resistor: 0.100
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
interpolate: false
run_current: 0.45
stealthchop_threshold: 0

#####################################################################
#####################################################################
#   Bed Heater
#####################################################################
[heater_bed]
heater_pin: PG11
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA1  # TH0 thermistor input
pullup_resistor: 2200
max_power: 1.0
control: pid
pid_kp: 50.0
pid_ki: 1.0
pid_kd: 200.0
min_temp: -5
max_temp: 120

#####################################################################
#   Fan Control
#####################################################################

[fan]
pin: nhk:gpio6
max_power: 1.0
kick_start_time: 0.5
off_below: 0.10


[heater_fan hotend_fan]
pin: nhk:gpio5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

#####################################################################
# FAN MACROS
#####################################################################

# Electronics Bay Fan (Temperature Controlled)
[temperature_fan electronics_bay_auto]
pin: PB3
sensor_type: temperature_mcu
sensor_mcu: mcu
target_temp: 45.0
max_speed: 1.0
min_speed: 0.3
control: pid
pid_Kp: 5.0
pid_Ki: 0.1
pid_Kd: 40.0
shutdown_speed: 0
min_temp: 10
max_temp: 85

# Controller/Motherboard Fan (Temperature Controlled) 
[temperature_fan motherboard_auto]
pin: PF7
tachometer_pin: PF6
sensor_type: temperature_host  # Uses Pi temperature instead of MCU
target_temp: 50.0
max_speed: 1.0
min_speed: 0.2
control: pid
pid_Kp: 5.0
pid_Ki: 0.1
pid_Kd: 40.0
shutdown_speed: 0
min_temp: 10
max_temp: 85






