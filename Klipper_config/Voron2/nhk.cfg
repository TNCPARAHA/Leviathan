#####################################################################
#   NITEHAWK JABBERWOCKY TOOLHEAD CONFIGURATION
#   This file contains all toolhead-related components
#####################################################################

[mcu nhk]  # NITEHAWK JABBERWOCKY TOOLHEAD 
serial: /dev/serial/by-id/usb-Klipper_rp2040_3033393834055A9D-if00   # DO NOT CHANGE 
baud: 1000000
restart_method: command
#####################################################################
## PCB Activity Light
#####################################################################
[output_pin act_led]
pin: !nhk:gpio8

#####################################################################
# nhk temp monitoring
#####################################################################

[temperature_sensor nhk_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: nhk
min_temp: 0
max_temp: 100

####################################################################
#   Toolhead Endstops
#####################################################################

## X Endstop - Toolhead PCB
[stepper_x]
endstop_pin: nhk:gpio13

## Y Endstop - Toolhead PCB 
[stepper_y]
endstop_pin: nhk:gpio12

#####################################################################
#   Extruder Configuration
#####################################################################

[extruder]
step_pin: nhk:gpio23
dir_pin: !nhk:gpio24
enable_pin: !nhk:gpio25
microsteps: 16
rotation_distance: 35
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nhk:gpio9
sensor_type: Generic 3950
sensor_pin: nhk:gpio29
pullup_resistor: 2200
control: pid
pid_kp: 43.100
pid_ki: 11.972  
pid_kd: 38.790
min_temp: 0
max_temp: 315
min_extrude_temp: 170
max_extrude_only_distance: 1000
max_extrude_cross_section: 30
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
sense_resistor: 0.100
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
interpolate: false
run_current: 0.45

#####################################################################
#   Probe Configuration
#####################################################################

[probe]
pin: !nhk:gpio10
z_offset: -0.500
x_offset: 0
y_offset: 0
speed: 10
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.006
samples_tolerance_retries: 3

#####################################################################
#   Toolhead Fan Control
#####################################################################

## Part Cooling Fan
[fan]
pin: nhk:gpio6
max_power: 1.0
kick_start_time: 0.5
off_below: 0.10

## Hotend Fan
[heater_fan hotend_fan]
pin: nhk:gpio5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
tachometer_pin: nhk:gpio16
tachometer_ppr: 2

#####################################################################
