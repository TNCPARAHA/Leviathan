#####################################################################
#   LED Control
#####################################################################

[neopixel case_leds]
pin: PF10
chain_count: 3  # Reduced for testing
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

#####################################################################
#   LED Test Macros
#####################################################################

[gcode_macro LED_TEST_ONE]
description: Test just first LED
gcode:
    SET_LED LED=case_leds RED=1.0 GREEN=0.0 BLUE=0.0 INDEX=1

[gcode_macro LED_TEST_ALL_RED]  
description: Test all LEDs red
gcode:
    SET_LED LED=case_leds RED=1.0 GREEN=0.0 BLUE=0.0

[gcode_macro LED_TEST_SEQUENCE]
description: Test LEDs one by one
gcode:
    {% for i in range(1, 26) %}
        SET_LED LED=case_leds RED=0.0 GREEN=0.0 BLUE=0.0  # Clear all
        SET_LED LED=case_leds RED=1.0 GREEN=0.0 BLUE=0.0 INDEX={i}
        G4 P500  # Wait 500ms
    {% endfor %}
    SET_LED LED=case_leds RED=0.0 GREEN=0.0 BLUE=0.0  # Clear all

[gcode_macro LED_OFF]
description: Turn off all LEDs
gcode:
    SET_LED LED=case_leds RED=0.0 GREEN=0.0 BLUE=0.0

[gcode_macro LED_BASIC_TEST]
description: Simple LED test with manual commands
gcode:
    RESPOND MSG="Testing LED: case_leds"
    SET_LED LED=case_leds RED=1.0 GREEN=0.0 BLUE=0.0 WHITE=0.0 INDEX=1

[gcode_macro LED_TEST_COLOR_ORDER]
description: Test different color orders
gcode:
    RESPOND MSG="Testing RED..."
    SET_LED LED=case_leds RED=1.0 GREEN=0.0 BLUE=0.0 WHITE=0.0 INDEX=1
    G4 P1000
    RESPOND MSG="Testing GREEN..."
    SET_LED LED=case_leds RED=0.0 GREEN=1.0 BLUE=0.0 WHITE=0.0 INDEX=1
    G4 P1000
    RESPOND MSG="Testing BLUE..."
    SET_LED LED=case_leds RED=0.0 GREEN=0.0 BLUE=1.0 WHITE=0.0 INDEX=1
    G4 P1000
    RESPOND MSG="Testing WHITE..."
    SET_LED LED=case_leds RED=0.0 GREEN=0.0 BLUE=0.0 WHITE=1.0 INDEX=1
    G4 P1000
    SET_LED LED=case_leds RED=0.0 GREEN=0.0 BLUE=0.0 WHITE=0.0 INDEX=1

[gcode_macro LED_LIST]
description: List all available LEDs
gcode:
    RESPOND MSG="Available LEDs: Check console output"

