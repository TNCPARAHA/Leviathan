#####################################################################
#   CARTOGRAPHER SCANNER CONFIGURATION
#   Simple configuration for Cartographer MCU and temperature monitoring
#####################################################################

# [mcu Cartographer]  # CARTOGRAPHER SCANNER - ATTACHED TO TOOLHEAD
# serial: /dev/serial/by-id/usb-Cartographer_614e_230029000443565633393720-if00  # DO NOT CHANGE
# COMMENTED OUT - [scanner] section creates its own MCU connection

#####################################################################
#   Cartographer Scanner Configuration
#####################################################################

[scanner]
serial: /dev/serial/by-id/usb-Cartographer_614e_230029000443565633393720-if00
x_offset: 0
y_offset: 0
calibration_method: touch
sensor: cartographer
sensor_alt: carto
scanner_touch_threshold: 3500

#####################################################################
#   Cartographer Temperature Monitoring
#####################################################################

[temperature_sensor Cartographer_MCU]
sensor_type: temperature_mcu
sensor_mcu: scanner
min_temp: 0
max_temp: 105

#####################################################################
#   Cartographer Macros - COMMENTED OUT - Built into scanner module
#####################################################################

# [gcode_macro CARTOGRAPHER_TOUCH]
# gcode:
#     G90
#     G1 Z10 F600
#     G1 X175 Y175 F6000
#     CARTO_TOUCH

#####################################################################
#   Bed Mesh Configuration for Cartographer
#####################################################################

[bed_mesh]
speed: 300
horizontal_move_z: 10
mesh_min: 40, 40
mesh_max: 310, 310
fade_start: 0.6
fade_end: 10.0
probe_count: 5,5
algorithm: bicubic
zero_reference_position: 175,175

#####################################################################
#   Quad Gantry Level for Cartographer
#####################################################################

[quad_gantry_level]
gantry_corners:
    -60,-10
    410,420
points:
    50,25
    50,275
    300,275
    300,25
speed: 150
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10
