######################################################################################################################################################################################################
# MACROS
######################################################################################################################################################################################################

[gcode_macro TOOLHEAD_DIAG]
description: Blink ACT LED, check fan RPM, probe status, and MCU temp
gcode:
    RESPOND PREFIX=toolhead MSG="🔧 TOOLHEAD DIAG START"
    SET_PIN PIN=act_led VALUE=1
    QUERY_FAN fan
    QUERY_FAN hotend_fan
    QUERY_PROBE
    QUERY_ADC name=nhk_mcu_temp
    SET_PIN PIN=act_led VALUE=0
    RESPOND PREFIX=toolhead MSG="✅ TOOLHEAD DIAG COMPLETE"







######################################################################
# UART HEALTH CHECK
######################################################################

[gcode_macro CHECK_UART_HEALTH]
description: Dump TMC driver status for UART validation
gcode:
    RESPOND MSG="📡 Dumping TMC driver status"
    DUMP_TMC stepper_x
    DUMP_TMC stepper_y
    DUMP_TMC stepper_z
    DUMP_TMC stepper_z1
    DUMP_TMC stepper_z2
    DUMP_TMC stepper_z3
    DUMP_TMC extruder
    RESPOND MSG="✅ UART check complete"



#####################################################################
# FAN MACROS
#####################################################################

# Electronics Bay Fan (Temperature Controlled)
[temperature_fan electronics_bay_auto]
pin: PB3
sensor_type: temperature_mcu
sensor_mcu: mcu
target_temp: 45.0
max_speed: 1.0
min_speed: 0.3
control: pid
pid_Kp: 5.0
pid_Ki: 0.1
pid_Kd: 40.0
shutdown_speed: 0
min_temp: 10
max_temp: 70

# Controller/Motherboard Fan (Temperature Controlled) 
[temperature_fan motherboard_auto]
pin: PF7
tachometer_pin: PF6
sensor_type: temperature_host  # Uses Pi temperature instead of MCU
target_temp: 50.0
max_speed: 1.0
min_speed: 0.2
control: pid
pid_Kp: 5.0
pid_Ki: 0.1
pid_Kd: 40.0
shutdown_speed: 0
min_temp: 10
max_temp: 80

[gcode_macro FAN_EB_ON]
gcode:
    SET_FAN_SPEED FAN=fan SPEED=1.0
    SET_FAN_SPEED FAN=fan1 SPEED=1.0
    SET_FAN_SPEED FAN=fan2 SPEED=1.0

[gcode_macro FAN_EB_OFF]
gcode:
    SET_FAN_SPEED FAN=fan SPEED=0
    SET_FAN_SPEED FAN=fan1 SPEED=0
    SET_FAN_SPEED FAN=fan2 SPEED=0

[gcode_macro FAN_EB_HALF]
gcode:
    SET_FAN_SPEED FAN=fan SPEED=0.5
    SET_FAN_SPEED FAN=fan1 SPEED=0.5
    SET_FAN_SPEED FAN=fan2 SPEED=0.5

#####################################################################
#   PID Calibration Macros
#####################################################################
[gcode_macro PID_HOTEND]
description: PID calibrate hotend - no homing required
gcode:
    {% set TARGET = params.TARGET|default(245)|float %}
    
    RESPOND MSG="Starting PID calibration for hotend at {TARGET}°C"
    RESPOND MSG="This will take several minutes..."
    RESPOND MSG="Make sure toolhead is positioned safely first!"
    
    # Turn on part cooling fan to simulate printing conditions
    M106 S128
    
    # Start PID calibration
    PID_CALIBRATE HEATER=extruder TARGET={TARGET}
    
    # Turn off part cooling fan
    M106 S0
    
    RESPOND MSG="PID calibration complete! Don't forget to SAVE_CONFIG"

[gcode_macro PID_BED]
description: PID calibrate bed at specified temp (default 110°C)
gcode:
    {% set TARGET = params.TARGET|default(110)|float %}
    
    RESPOND MSG="Starting PID calibration for bed at {TARGET}°C"
    RESPOND MSG="This will take several minutes..."
    
    # Start PID calibration for bed
    PID_CALIBRATE HEATER=heater_bed TARGET={TARGET}
    
    RESPOND MSG="PID calibration complete! Don't forget to SAVE_CONFIG"

[gcode_macro PID_ALL]
description: PID calibrate both hotend and bed (hotend_temp=245, bed_temp=110)
gcode:
    {% set HOTEND_TEMP = params.HOTEND_TEMP|default(245)|float %}
    {% set BED_TEMP = params.BED_TEMP|default(110)|float %}
    
    RESPOND MSG="Starting full PID calibration sequence"
    RESPOND MSG="Hotend: {HOTEND_TEMP}°C, Bed: {BED_TEMP}°C"
    
    # Calibrate bed first (takes longer)
    RESPOND MSG="Calibrating bed heater..."
    PID_BED TARGET={BED_TEMP}
    
    # Wait a moment
    G4 P2000
    
    # Calibrate hotend
    RESPOND MSG="Calibrating hotend..."
    PID_HOTEND TARGET={HOTEND_TEMP}
    
    RESPOND MSG="All PID calibrations complete!"
    RESPOND MSG="Run SAVE_CONFIG to save the new PID values"

#####################################################################
#   CHAMBER LED CONTROL MACROS
#####################################################################

[gcode_macro CHAMBER_LIGHTS_ON]
description: Turn on chamber lights at full brightness
gcode:
    SET_LED LED=chamber_leds RED=0.8 GREEN=0.8 BLUE=0.8 WHITE=0.0

[gcode_macro CHAMBER_LIGHTS_OFF]
description: Turn off chamber lights
gcode:
    SET_LED LED=chamber_leds RED=0.0 GREEN=0.0 BLUE=0.0 WHITE=0.0

[gcode_macro CHAMBER_LIGHTS_DIM]
description: Dim chamber lights for ambient lighting
gcode:
    SET_LED LED=chamber_leds RED=0.1 GREEN=0.1 BLUE=0.2 WHITE=0.0

[gcode_macro CHAMBER_LIGHTS_PRINT]
description: Set chamber lights for printing (moderate brightness)
gcode:
    SET_LED LED=chamber_leds RED=0.3 GREEN=0.3 BLUE=0.4 WHITE=0.0

[gcode_macro CHAMBER_RAINBOW]
description: Rainbow effect for chamber lights
gcode:
    {% for i in range(25) %}
        {% set hue = (i * 360 / 25) | int %}
        {% if hue < 60 %}
            {% set r = 1.0 %}
            {% set g = (hue / 60) %}
            {% set b = 0.0 %}
        {% elif hue < 120 %}
            {% set r = (1.0 - (hue - 60) / 60) %}
            {% set g = 1.0 %}
            {% set b = 0.0 %}
        {% elif hue < 180 %}
            {% set r = 0.0 %}
            {% set g = 1.0 %}
            {% set b = ((hue - 120) / 60) %}
        {% elif hue < 240 %}
            {% set r = 0.0 %}
            {% set g = (1.0 - (hue - 180) / 60) %}
            {% set b = 1.0 %}
        {% elif hue < 300 %}
            {% set r = ((hue - 240) / 60) %}
            {% set g = 0.0 %}
            {% set b = 1.0 %}
        {% else %}
            {% set r = 1.0 %}
            {% set g = 0.0 %}
            {% set b = (1.0 - (hue - 300) / 60) %}
        {% endif %}
        SET_LED LED=chamber_leds RED={r * 0.5} GREEN={g * 0.5} BLUE={b * 0.5} INDEX={i+1}
    {% endfor %}

#####################################################################
#   PRINTING MACROS
#####################################################################

[gcode_macro PRINT_START]
description: Start print sequence with heating and preparation
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    
    STATUS_HEATING                          # Set LED status
    CHAMBER_LIGHTS_PRINT                    # Set chamber lighting
    
    # Start bed heating
    M140 S{BED_TEMP}
    
    # Home all axes
    STATUS_HOMING
    G28
    
    # Heat bed and wait
    STATUS_HEATING
    M190 S{BED_TEMP}
    
    # QGL if not already done
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    
    # Final home Z after QGL
    G28 Z
    
    # Bed mesh
    STATUS_MESHING
    BED_MESH_CALIBRATE
    
    # Move to purge position
    G1 X10 Y10 Z0.3 F3000
    
    # Heat extruder and wait
    STATUS_HEATING
    M109 S{EXTRUDER_TEMP}
    
    # Purge line
    STATUS_PRINTING
    G92 E0
    G1 X100 E15 F1500                      # Purge line
    G1 Y10.5 F1500
    G1 X10 E15 F1500                       # Purge line
    G92 E0
    
    STATUS_PRINTING

[gcode_macro PRINT_END]
description: End print sequence with cooling and cleanup
gcode:
    # Safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                                    # Wait for buffer to clear
    G92 E0                                  # Zero the extruder
    G1 E-5.0 F1800                         # Retract filament
    
    TURN_OFF_HEATERS
    STATUS_COOLING
    
    G90                                     # Absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000 # Move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  # Park nozzle at rear
    M107                                    # Turn off fan
    
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    
    STATUS_PART_READY
    CHAMBER_LIGHTS_ON                       # Bright lights for part inspection

[gcode_macro SCAN_BED]
gcode:
  SCANNER_START
  SCANNER_WAIT
  BED_MESH_CALIBRATE

#####################################################################
#   MAINTENANCE MACROS
#####################################################################

[gcode_macro PARK_TOOLHEAD]
description: Park toolhead at rear center for maintenance
gcode:
    STATUS_BUSY
    G90
    G0 X175 Y350 Z100 F6000
    STATUS_READY

[gcode_macro CENTER_TOOLHEAD]
description: Center toolhead for bed access
gcode:
    STATUS_BUSY
    G90
    G0 X175 Y175 Z100 F6000
    STATUS_READY

[gcode_macro LOAD_FILAMENT]
description: Load filament with heating
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    
    STATUS_HEATING
    M109 S{EXTRUDER_TEMP}                   # Heat and wait
    
    STATUS_BUSY
    M83                                     # Relative extrusion
    G1 E50 F300                             # Load filament
    G1 E30 F150                             # Prime
    G92 E0                                  # Reset extruder
    STATUS_READY

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament with heating
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    
    STATUS_HEATING
    M109 S{EXTRUDER_TEMP}                   # Heat and wait
    
    STATUS_BUSY
    M83                                     # Relative extrusion
    G1 E10 F300                             # Extrude a bit to soften tip
    G1 E-80 F1800                           # Unload filament
    G92 E0                                  # Reset extruder
    STATUS_READY

[gcode_macro PREHEAT_PLA]
description: Preheat for PLA
gcode:
    STATUS_HEATING
    M140 S60                                # Bed temp
    M104 S210                               # Extruder temp (no wait)
    CHAMBER_LIGHTS_ON

[gcode_macro PREHEAT_ABS]
description: Preheat for ABS  
gcode:
    STATUS_HEATING
    M140 S100                               # Bed temp
    M104 S250                               # Extruder temp (no wait)
    CHAMBER_LIGHTS_ON

[gcode_macro PREHEAT_PETG]
description: Preheat for PETG
gcode:
    STATUS_HEATING
    M140 S80                                # Bed temp
    M104 S230                               # Extruder temp (no wait)
    CHAMBER_LIGHTS_ON

#####################################################################
#   CALIBRATION MACROS
#####################################################################

[gcode_macro CALIBRATE_Z]
description: Calibrate Z offset using probe
gcode:
    STATUS_HOMING
    G28                                     # Home all
    STATUS_CALIBRATING_Z
    CALIBRATE_Z                             # Run Z calibration
    STATUS_READY

[gcode_macro BED_MESH_LOAD]
description: Load saved bed mesh
gcode:
    BED_MESH_PROFILE LOAD=default
    {action_respond_info("Loaded bed mesh 'default'")}

[gcode_macro BED_MESH_SAVE]
description: Save current bed mesh as default
gcode:
    BED_MESH_PROFILE SAVE=default
    SAVE_CONFIG
    {action_respond_info("Saved bed mesh as 'default'")}

#####################################################################
#   EMERGENCY MACROS
#####################################################################

[gcode_macro EMERGENCY_STOP]
description: Emergency stop with all systems off
gcode:
    M112                                    # Emergency stop
    STATUS_OFF
    CHAMBER_LIGHTS_OFF

[gcode_macro MOTORS_OFF]
description: Turn off all stepper motors
gcode:
    M84                                     # Turn off motors
    STATUS_OFF

#####################################################################
#   FUN MACROS
#####################################################################

[gcode_macro LIGHT_SHOW]
description: Fun light show for demos
gcode:
    {% for cycle in range(3) %}
        CHAMBER_RAINBOW
        G4 P2000                            # Wait 2 seconds
        CHAMBER_LIGHTS_OFF
        G4 P500                             # Wait 0.5 seconds
        CHAMBER_LIGHTS_ON
        G4 P500
    {% endfor %}
    CHAMBER_LIGHTS_DIM

[gcode_macro PRINTER_STATUS]
description: Display current printer status
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        {action_respond_info("Status: PRINTING")}
        STATUS_PRINTING
    {% elif printer.extruder.temperature > 50 %}
        {action_respond_info("Status: HOT - Cooling Down")}
        STATUS_COOLING
    {% else %}
        {action_respond_info("Status: READY")}
        STATUS_READY
    {% endif %}
